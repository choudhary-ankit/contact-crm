# Render Blueprint: describes the backend service so it can be created from this repo.
# Secrets are marked `sync: false`, which makes Render ask for them in the dashboard; they are never stored in git.
services:
  - type: web
    name: contact-crm-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: ohio            # same region as the Neon database (AWS US East 2)
    plan: free              # free instances sleep when idle: the first request after a quiet period is slow
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL   # the Neon connection string (direct, not pooled)
        sync: false
      - key: API_KEYS       # "<long random key>:11111111-1111-4111-8111-111111111111" (account id of the seeded demo data)
        sync: false
      - key: CORS_ORIGIN    # the frontend's URL, e.g. https://your-site.netlify.app (comma-separate several)
        sync: false
      - key: TRUST_PROXY    # Render puts one proxy in front of the app
        value: "1"
      - key: AUTO_MIGRATE   # apply new migrations on boot (guarded by an advisory lock)
        value: "true"
